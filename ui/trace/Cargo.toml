bviz_critical_path = { workspace = true }
bviz_input = { workspace = true }
bviz_invocation = { workspace = true }
bviz_label = { workspace = true }
bviz_switches = { workspace = true }
bviz_trace_profile = { workspace = true }
bviz_trace_layout = { workspace = true }
bviz_ui_assets = { workspace = true }
bviz_ui_components = { workspace = true }
bviz_ui_playback = { workspace = true }
bviz_ui_session = { workspace = true }
bviz_ui_spawn_phase = { workspace = true }
bviz_ui_theme = { workspace = true }
bviz_ui_trace_args = { workspace = true }
bviz_ui_workspace = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
bviz_ui_web = { workspace = true }
