version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
gpui = { workspace = true, features = ["inspector"] }
