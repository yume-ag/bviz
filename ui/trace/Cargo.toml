[package]
name = "bviz_ui_trace"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
gpui = { workspace = true, features = ["inspector"] }
bviz_alloc = { path = "../../alloc" }
bviz_critical_path = { path = "../../critical_path" }
bviz_input = { workspace = true }
bviz_invocation = { workspace = true }
bviz_label = { workspace = true }
bviz_trace_profile = { path = "../../trace/profile" }
bviz_trace_layout = { path = "../../trace/layout" }
bviz_ui_assets = { path = "../assets" }
bviz_ui_components = { path = "../components" }
bviz_ui_playback = { path = "../playback" }
bviz_ui_spawn_phase = { path = "../spawn_phase" }
bviz_ui_theme = { path = "../theme" }
bviz_ui_trace_args = { path = "args" }
bviz_ui_workspace = { path = "../workspace" }
