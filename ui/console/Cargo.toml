[package]
name = "bviz_ui_console"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "console"
path = "src/main.rs"

[lib]
name = "bviz_ui_console"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
gpui = { workspace = true }
bviz_input = { workspace = true }
bviz_invocation = { workspace = true }
bviz_terminal = { path = "../../terminal" }
bviz_ui_assets = { path = "../assets" }
bviz_ui_components = { path = "../components" }
bviz_ui_console_args = { path = "args" }
bviz_ui_playback = { path = "../playback" }
bviz_ui_session = { path = "../session" }
bviz_ui_theme = { path = "../theme" }
bviz_ui_workspace = { path = "../workspace" }

[dev-dependencies]
prost = { workspace = true }
