[package]
name = "bviz_ui_graph"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
bviz_bazel_flags = { workspace = true }
clap = { workspace = true }
gpui = { workspace = true, features = ["inspector"] }
bviz_graph_layout = { path = "../../graph/layout" }
bviz_input = { workspace = true }
bviz_invocation = { workspace = true }
bviz_label = { workspace = true }
bviz_parallel = { workspace = true }
bviz_switches = { workspace = true }
bviz_time = { workspace = true }
bviz_ui_assets = { path = "../assets" }
bviz_ui_components = { path = "../components" }
bviz_ui_graph_args = { path = "args" }
bviz_ui_playback = { path = "../playback" }
bviz_ui_session = { path = "../session" }
bviz_ui_theme = { path = "../theme" }
bviz_ui_workspace = { path = "../workspace" }
fixedbitset = { workspace = true }
lyon_tessellation = { workspace = true }
cfg-if = "1"
nucleo = { workspace = true }
rustc-hash = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
bviz_ui_web = { path = "../web" }

[dev-dependencies]
fastrand = { workspace = true }
