[package]
name = "bviz_ui_graph"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "graph"
path = "src/main.rs"

[dependencies]
bviz_bazel_flags = { workspace = true }
clap = { workspace = true }
gpui = { workspace = true, features = ["inspector"] }
bviz_graph_layout = { workspace = true }
bviz_input = { workspace = true }
bviz_invocation = { workspace = true }
bviz_label = { workspace = true }
bviz_parallel = { workspace = true }
bviz_switches = { workspace = true }
bviz_time = { workspace = true }
bviz_ui_assets = { workspace = true }
bviz_ui_components = { workspace = true }
bviz_ui_graph_args = { workspace = true }
bviz_ui_playback = { workspace = true }
bviz_ui_session = { workspace = true }
bviz_ui_theme = { workspace = true }
bviz_ui_workspace = { workspace = true }
fixedbitset = { workspace = true }
lyon_tessellation = { workspace = true }
cfg-if = "1"
nucleo = { workspace = true }
rustc-hash = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
bviz_ui_web = { workspace = true }

[dev-dependencies]
fastrand = { workspace = true }
bviz_ui_testing = { workspace = true }
