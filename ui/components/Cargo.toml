[package]
name = "bviz_ui_components"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bviz_ui_components"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
bviz_invocation = { workspace = true }
bviz_label = { workspace = true }
bviz_parallel = { workspace = true }
bviz_ui_assets = { path = "../assets" }
bviz_ui_theme = { path = "../theme" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["wayland"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
