[package]
name = "bviz_ui_web"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bviz_ui_web"
path = "src/lib.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
bviz_input = { workspace = true }
console_error_panic_hook = "0.1"
js-sys = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = [
    "Blob",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlElement",
    "HtmlInputElement",
    "MouseEvent",
    "Node",
    "UiEvent",
    "Window",
] }
