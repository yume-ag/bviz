[package]
name = "bviz_ui_web"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bviz_ui_web"
path = "src/lib.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
bviz_alloc = { workspace = true }
bviz_input = { workspace = true }
bviz_links = { workspace = true }
bviz_parallel = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_thread = { workspace = true }
web-sys = { workspace = true, features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "BroadcastChannel",
    "Crypto",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Headers",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Node",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ReferrerPolicy",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "UiEvent",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
