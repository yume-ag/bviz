[package]
name = "bviz_ui_shell"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "bviz_ui_shell"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
bviz_ui_assets = { path = "../assets" }
bviz_ui_components = { path = "../components" }
bviz_ui_theme = { path = "../theme" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { workspace = true }
