[workspace]
members = [
    "alloc",
    "bazel_flags",
    "bazel_flags/args",
    "bviz",
    "cli",
    "critical_path",
    "execlog",
    "graph/layout",
    "invocation",
    "label",
    "sniff",
    "terminal",
    "tools/notices",
    "tools/proto_field_numbers",
    "tools/scene_header",
    "tools/wat_js",
    "trace/layout",
    "trace/profile",
    "ui/assets",
    "ui/components",
    "ui/console",
    "ui/console/args",
    "ui/execlog",
    "ui/execlog/args",
    "ui/graph",
    "ui/graph/args",
    "ui/playback",
    "ui/session",
    "ui/shell",
    "ui/spawn_phase",
    "ui/theme",
    "ui/trace",
    "ui/trace/args",
    "ui/web",
    "ui/workspace",
    "util/input",
    "util/parallel",
    "util/switches",
    "util/time",
    "web",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
publish = false
repository = "https://github.com/yume-ag/bviz"

[workspace.dependencies]
alacritty_terminal = "0.26"
bviz_alloc = { path = "alloc" }
bviz_bazel_flags = { path = "bazel_flags" }
bviz_bazel_flags_args = { path = "bazel_flags/args" }
bviz_cli = { path = "cli" }
bviz_critical_path = { path = "critical_path" }
bviz_execlog = { path = "execlog" }
bviz_graph_layout = { path = "graph/layout" }
bviz_input = { path = "util/input" }
bviz_invocation = { path = "invocation" }
bviz_label = { path = "label" }
bviz_parallel = { path = "util/parallel" }
bviz_sniff = { path = "sniff" }
bviz_switches = { path = "util/switches" }
bviz_terminal = { path = "terminal" }
bviz_time = { path = "util/time" }
bviz_trace_layout = { path = "trace/layout" }
bviz_trace_profile = { path = "trace/profile" }
bviz_ui_assets = { path = "ui/assets" }
bviz_ui_components = { path = "ui/components" }
bviz_ui_console = { path = "ui/console" }
bviz_ui_console_args = { path = "ui/console/args" }
bviz_ui_execlog = { path = "ui/execlog" }
bviz_ui_execlog_args = { path = "ui/execlog/args" }
bviz_ui_graph = { path = "ui/graph" }
bviz_ui_graph_args = { path = "ui/graph/args" }
bviz_ui_playback = { path = "ui/playback" }
bviz_ui_session = { path = "ui/session" }
bviz_ui_shell = { path = "ui/shell" }
bviz_ui_spawn_phase = { path = "ui/spawn_phase" }
bviz_ui_theme = { path = "ui/theme" }
bviz_ui_trace = { path = "ui/trace" }
bviz_ui_trace_args = { path = "ui/trace/args" }
bviz_ui_web = { path = "ui/web" }
bviz_ui_workspace = { path = "ui/workspace" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dlmalloc = "0.2"
fastrand = "2"
fixedbitset = "0.5"
flate2 = { version = "1", features = ["zlib-rs"] }
hashbrown = { version = "0.16", default-features = false }
heck = "0.5"
js-sys = "0.3"
libmimalloc-sys = "0.1"
lyon_tessellation = "1.0"
mimalloc = "0.1"
nucleo = "0.5"
num_cpus = "1"
packageurl = "0.7"
percent-encoding = "2"
rayon = "1"
regex-automata = "0.4"
regex-syntax = "0.8"
rustc-hash = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
spdx = "0.13"
tiny_http = { version = "0.12", default-features = false }
# Locked so Bazel can build wasm-bindgen's CLI at the version bviz links; no
# crate links it.
wasm-bindgen-cli = { version = "0.2", default-features = false }
wat = "1"
web-sys = "0.3"
web-time = "1"
zstd = { version = "0.14", default-features = false }
org-eclipse-elk-alg-layered = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-core = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-graph = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
prost = "0.13"
prost-types = "0.13"
protoc-gen-prost = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.3" }
gpui_web = { git = "https://github.com/zed-industries/zed", tag = "v1.24.3" }
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937" }

