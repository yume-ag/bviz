[workspace]
members = [
    "alloc",
    "bazel_flags",
    "bazel_flags/args",
    "bviz",
    "cli",
    "critical_path",
    "execlog",
    "graph/layout",
    "invocation",
    "label",
    "terminal",
    "tools/notices",
    "tools/proto_field_numbers",
    "tools/scene_header",
    "trace/layout",
    "trace/profile",
    "ui/assets",
    "ui/components",
    "ui/console",
    "ui/console/args",
    "ui/execlog",
    "ui/execlog/args",
    "ui/graph",
    "ui/graph/args",
    "ui/playback",
    "ui/shell",
    "ui/spawn_phase",
    "ui/theme",
    "ui/trace",
    "ui/trace/args",
    "ui/workspace",
    "util/parallel",
]
exclude = ["third_party/ztracing"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
publish = false
repository = "https://github.com/yume-ag/bviz"

[workspace.dependencies]
alacritty_terminal = "0.26"
bviz_bazel_flags = { path = "bazel_flags" }
bviz_label = { path = "label" }
bviz_invocation = { path = "invocation" }
bviz_parallel = { path = "util/parallel" }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
fastrand = "2"
fixedbitset = "0.5"
flate2 = { version = "1", features = ["zlib-rs"] }
hashbrown = { version = "0.16", default-features = false }
heck = "0.5"
libmimalloc-sys = "0.1"
lyon_tessellation = "1.0"
mimalloc = "0.1"
nucleo = "0.5"
num_cpus = "1"
packageurl = "0.7"
rayon = "1"
regex-automata = "0.4"
regex-syntax = "0.8"
rustc-hash = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spdx = "0.13"
zstd = { version = "0.14", default-features = false }
org-eclipse-elk-alg-layered = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-core = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
org-eclipse-elk-graph = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.2" }
prost = "0.13"
prost-types = "0.13"
protoc-gen-prost = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.3" }

# gpui's sum_tree depends on ztracing, which with ztracing_macro and zlog is
# GPL-3.0-or-later; linking them would put every bviz binary under the GPL.
# Built without the `ztracing` cfg, sum_tree uses only its no-op `instrument`
# attribute.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "third_party/ztracing" }
